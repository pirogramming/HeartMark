{% load static %}
<article class="person-card" data-person-card data-person-name="{{ person.name|lower }}" data-person-id="{{ person.id }}">
    <div class="person-card__character">
        <img src="{% static person.character_static %}" alt="{{ person.name }}님의 캐릭터">
    </div>
    <div class="person-card__copy">
        <strong>{{ person.name }}</strong>
        <p>{{ person.message }}</p>
    </div>
    <div class="person-card__actions">
        {% if request_type == "received" %}
        <button class="soft-button" type="button" data-mock-action="reject">거절</button>
        <button class="soft-button soft-button--accept" type="button" data-mock-action="accept">친구 수락</button>
        {% else %}
        <span class="waiting-sticker">답장 기다리는 중</span>
        <button class="soft-button" type="button" data-mock-action="cancel">요청 취소</button>
        {% endif %}
    </div>
</article>
