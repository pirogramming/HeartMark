{% load static %}
<article class="shared-record-card" id="shared-record-{{ item.share_id }}">
    <header class="shared-record-card__sender">
        <span class="shared-record-card__avatar">
            <img src="{{ item.sender_character_url }}" alt="">
        </span>
        <div>
            <strong>{{ item.sender_name }}님이 보낸 마음 편지</strong>
            <time>{{ item.record_date }}</time>
        </div>
        <span class="shared-record-card__stamp" aria-hidden="true">HEART<br>MAIL</span>
    </header>

    <div class="shared-record-card__body">
        <div class="shared-record-card__photo">
            {% if item.image_url %}
            <img src="{{ item.image_url }}" alt="{{ item.record_date }} 기록 사진">
            {% else %}
            <span>기록에 사진이 없어요.</span>
            {% endif %}
        </div>

        <div class="shared-record-card__content">
            <h3 class="shared-record-card__title">{{ item.title }}</h3>
            <div class="shared-record-card__emotion">
                <img
                    src="{{ item.main_emotion_image_url }}"
                    alt="대표 감정 {{ item.main_emotion_name }}"
                    title="{{ item.main_emotion_name }}"
                >
                <span><small>대표 감정</small><strong>{{ item.main_emotion_name }}</strong></span>
            </div>
            <p>{{ item.content_preview }}</p>
        </div>
    </div>

    <footer class="shared-record-card__footer shared-record-card__footer--stacked">
        {% include "social_hub/partials/shared_record_comments.html" %}
        <div class="shared-record-card__footer-row shared-record-card__footer-row--end">
            <a href="{{ item.detail_url }}">기록 보러가기</a>
        </div>
    </footer>
</article>
