{% extends "base.html" %}

{% block title %}친구 요청 | 마음자국{% endblock %}

{% block content %}
<section>
    <h1>친구 요청</h1>
    <p>{{ inviter_name }}님이 친구 요청을 보냈어요.</p>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <button type="submit" name="action" value="accept">수락하기</button>
        <button type="submit" name="action" value="reject">거절하기</button>
    </form>
</section>
{% endblock %}
