{% load static %}
<header class="site-header">
    <a class="site-logo" href="/" aria-label="마음자국 홈">
        <img src="{% static 'accounts/images/logo.png' %}" alt="마음자국">
    </a>
    <button type="button" class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
        {% comment %}
            record_entry_url은 항상 위치 선택 화면(locations:place_select)이다.
            모달을 바로 여는 트리거 속성은 위치 확정 후 넘어가는 지도 화면
            (locations/map.html)의 "기록하러 가기" 버튼에만 붙인다.
        {% endcomment %}
        <a href="{{ record_entry_url }}" data-tutorial-target="record-write">기록작성</a>
        <a href="{% url 'diary:list' %}" data-tutorial-target="record-list">기록보기</a>
        <a href="{% url 'diary:calendar' %}" data-tutorial-target="calendar">달력</a>
        <a href="{% url 'mypage:home' %}" data-tutorial-target="mypage">마이페이지</a>
        {% if user.is_authenticated %}
            <a class="nav-auth-link" href="{% url 'accounts:logout' %}" data-tutorial-target="auth">로그아웃</a>
        {% else %}
            <a class="nav-auth-link" href="{% url 'accounts:login' %}" data-tutorial-target="auth">로그인</a>
        {% endif %}
    </nav>
</header>
