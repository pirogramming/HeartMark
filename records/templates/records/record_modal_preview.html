{% endblock %}

{% block content %}

        <p>메인페이지가 완성되면 이 영역이 실제 메인 화면으로 교체됩니다.</p>
        <button id="open-record-modal" type="button">기록 작성 열기</button>
    </div>

{% include "records/partials/record_modal.html" %}
{% endblock %}

{% block extra_js %}

{% endblock %}
