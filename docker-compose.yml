# 이미지 빌드/푸시용 compose 파일.
# CI(GitHub Actions)에서 build & push할 때, 그리고 로컬에서 컨테이너를 확인할 때 쓴다.
# 실제 EC2 배포에는 docker-compose.prod.yml을 사용한다.

services:
  web:
    build: .
    # DOCKER_USERNAME은 CI에서 env로 주입한다. 비어 있으면 이미지 이름이
    # "/heartmark:staging"이 되어 invalid reference format으로 실패한다.
    image: ${DOCKER_USERNAME}/heartmark:staging
    env_file:
      # CI에는 .env가 없다(시크릿이라 커밋되지 않음). 빌드/푸시만 하면 되므로
      # 파일이 없어도 실패하지 않도록 required: false로 둔다.
      # 이 문법은 Docker Compose v2.24 이상에서 동작한다.
      - path: .env
        required: false
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_STATIC_ROOT: /app/staticfiles
    volumes:
      - db_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:
  media_data:
  static_data:
