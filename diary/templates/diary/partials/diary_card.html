{% load static %}
<!-- 일기 기록 카드 1개 감싸는 태그 -->
<article class="diary-card">
    <!-- 카드 전체를 클릭할 수 있도록 하는 링크 -->
    <a
        href="{% url 'records:detail' record.pk %}"
        class="diary-card-link"
    >
    <!-- 카드 상단의 이미지 전체를 감싸는 요소
        기록 사진, 대표 감정 아이콘 포함 -->
        <div class="diary-card-image-wrapper">
            <!--현재 기록에 이미지가 있다면?-->
            {% if record.image %}
                <img
                    src="{{ record.image.url }}"
                    alt="{{ record.created_at|date:'Y년 n월 j일' }} 기록 사진"
                    class="diary-card-image"
                >
            {% else %}
                <img
                    src="{% static 'records/images/default-record-image.png' %}"
                    alt="{{ record.created_at|date:'Y년 n월 j일' }} 기본 기록 이미지"
                    class="diary-card-image"
                >
            {% endif %}

            
        </div>

        <div class="diary-card-content">
            <time
                class="diary-card-date"
                datetime="{{ record.created_at|date:'Y-m-d' }}"
            >
                {{ record.created_at|date:"Y/m/d" }}
            </time>
            <!--카드 제목처럼 출력-->
            <h2 class="diary-card-title">
                {{ record.title }}
            </h2>

            <div class="diary-card-bottom-row">
                {% if record.place_name %}
                    <p class="diary-card-location">

                        <!-- 장소 아이콘 -->
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.25"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-map-pin-icon lucide-map-pin"
                        >
                            <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>

                        <!-- 장소명만 별도로 감싸서 말줄임표 처리 -->
                        <span class="diary-card-location-text">
                            {{ record.place_name }}
                        </span>

                    </p>
                {% else %}
                    <p class="diary-card-location diary-card-location--empty">
                        장소 정보 없음
                    </p>
                {% endif %}

                <!--대표 감정이 있다면?-->
                {% if record.main_emotion %}
                    <div
                        class="diary-card-emotion"
                        data-main-emotion="{{ record.main_emotion }}"
                        title="{{ record.main_emotion_name }}"
                    >
                    <!--화면에 실제 감정 아이콘을 표시하는 요소-->
                        <span
                            class="emotion-icon emotion-icon--{{ record.main_emotion }}"
                            aria-hidden="true"
                        ></span>

                        <span class="sr-only">
                            대표 감정 {{ record.main_emotion_name }}
                        </span>
                    </div>
                {% endif %}
            </div>
        </div>
    </a>
</article>
