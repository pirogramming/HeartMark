upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # 업로드되는 기록 사진 크기를 감안한 값.
    client_max_body_size 20M;

    # 정적 파일과 미디어는 Django를 거치지 않고 nginx가 직접 서빙한다.
    # 두 경로 모두 web 컨테이너와 같은 named volume을 공유한다.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;

        # Django가 ALLOWED_HOSTS와 CSRF 검사에 사용하는 헤더들.
        # 이 값이 없으면 프록시 뒤에서 호스트 판별이 어긋난다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
